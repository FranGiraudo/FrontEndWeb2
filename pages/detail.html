<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAuto | Detalle</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/detail.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/components.css?v=2">
    <link rel="stylesheet" href="../css/financing.css">
    <link rel="stylesheet" href="../css/ai-price.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body id="page-detail" class="bg-dark">
    <div id="header-placeholder"></div>

    <main class="product-container" id="car-detail-content" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div class="loading-state-modern">
            <div class="modern-spinner"></div>
            <p>Cargando detalles del vehículo...</p>
        </div>
    </main>

    <div id="photo-lightbox" class="lightbox-overlay">
        <span class="close-lightbox">&times;</span>
        <span class="nav-arrow prev-arrow" id="prev-btn">&#10094;</span>
        <div class="lightbox-image-container">
            <img class="lightbox-content" id="lightbox-image" src="" alt="Cargando...">
        </div>
        <span class="nav-arrow next-arrow" id="next-btn">&#10095;</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../js/env.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/financing.js"></script>
    <script src="../js/ai-price.js"></script>
    <script type="module" src="../js/detail.js"></script>
    <script src="../js/components.js?v=2"></script>
</body>
</html>
