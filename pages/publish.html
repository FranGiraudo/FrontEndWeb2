<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAuto | Publicar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/publish.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body id="page-publish" class="bg-dark">
    <div id="header-placeholder"></div>

    <main class="main-container">
        <section class="publish-card">
            <div class="card-header">
                <h1 id="publish-title">Publicar Vehículo</h1>
                <p id="publish-subtitle">Completá los datos para que nuestra IA analice tu auto.</p>
                
                <div class="mode-switch-container" style="display: flex; margin-top: 1.5rem; margin-bottom: 1rem; width: 100%;">
                    <div class="mode-switch" style="background: var(--surface); padding: 0.3rem; border-radius: 2rem; display: flex; position: relative; width: 100%; border: 1px solid var(--border);">
                        <div id="switch-glider" style="position: absolute; top: 0.3rem; left: 0.3rem; width: calc(50% - 0.3rem); height: calc(100% - 0.6rem); background: var(--accent-lavender); border-radius: 2rem; transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); z-index: 1;"></div>
                        
                        <button type="button" id="tab-normal" style="position: relative; z-index: 2; background: transparent; border: none; padding: 0.8rem; color: #fff; font-weight: 800; cursor: pointer; transition: color 0.3s; font-size: 0.9rem; flex: 1;">Venta Normal</button>
                        <button type="button" id="tab-auction" style="position: relative; z-index: 2; background: transparent; border: none; padding: 0.8rem; color: var(--text-muted); font-weight: 600; cursor: pointer; transition: color 0.3s; font-size: 0.9rem; flex: 1;">Subasta</button>
                    </div>
                </div>
            </div>

            <form id="form-publicar">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Marca</label>
                        <input type="text" id="input-marca" placeholder="Ej: Volkswagen" required>
                    </div>
                    <div class="input-group">
                        <label>Modelo</label>
                        <input type="text" id="input-modelo" placeholder="Ej: Golf" required>
                    </div>

                    <div class="input-group">
                        <label>Año</label>
                        <input type="number" id="input-anio" min="1886" max="2027" placeholder="2024" required>
                    </div>
                    <div class="input-group">
                        <label>Kilometraje (km)</label>
                        <input type="number" id="input-km" min="0" placeholder="0" required>
                    </div>
                    

                    <div class="input-group">
                        <label>Combustible</label>
                        <select id="input-fuel" required>
                            <option value="" disabled selected>Seleccionar...</option>
                            <option value="Nafta">Nafta</option>
                            <option value="Diesel">Diesel</option>
                            <option value="GNC">GNC</option>
                            <option value="Hibrido">Híbrido</option>
                            <option value="Electrico">Eléctrico</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Transmisión</label>
                        <select id="input-trans" required>
                            <option value="" disabled selected>Seleccionar...</option>
                            <option value="Manual">Manual</option>
                            <option value="Automatica">Automática</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Motorización</label>
                        <input type="text" id="input-engine" placeholder="Ej: 1.6 MSI, 2.0 TSI" required>
                    </div>

                    <div class="input-group">
                        <label>Ubicación</label>
                        <input type="text" id="input-ubicacion" placeholder="Ej: Córdoba, Capital" required>
                    </div>
                    <div class="input-group" id="group-precio">
                        <label>Precio de Publicación (u$s)</label>
                        <input type="number" id="input-precio" min="1" placeholder="15000">
                    </div>

                    <!-- Campos de Subasta (Ocultos por defecto) -->
                    <div class="input-group auction-fields" style="display: none;">
                        <label style="color: var(--warning);">Precio Inicial Subasta (u$s)</label>
                        <input type="number" id="input-auction-price" min="1" placeholder="Ej: 10000">
                    </div>
                    <div class="input-group auction-fields" style="display: none;">
                        <label style="color: var(--warning);">Duración de la Subasta</label>
                        <select id="input-auction-duration">
                            <option value="1">1 Día (Express)</option>
                            <option value="3" selected>3 Días (Recomendado)</option>
                            <option value="5">5 Días</option>
                            <option value="7">1 Semana</option>
                        </select>
                    </div>

                    <div class="input-group full-width">
                        <label>Descripción del Vehículo</label>
                        <textarea id="input-descripcion" placeholder="Detalles sobre el estado, service, único dueño..." rows="4"></textarea>
                    </div>
                </div>

                <div class="upload-area">
                    <label>Fotos del vehículo</label>
                    <div class="drop-zone" id="drop-zone">
                        <div id="gallery-preview" class="gallery-preview-container"></div>
                        
                        <span class="drop-text" id="drop-text">Arrastrá tus fotos aquí o hacé click</span>
                        <input type="file" id="file-input" accept="image/*" multiple hidden>
                    </div>
                </div>

                <div class="ai-info-box" id="ai-container">
                    <div class="ai-content">
                        <p id="ai-text"> <b>Análisis IA:</b> Subí al menos una foto para iniciar el escaneo de seguridad.</p>
                        <div id="correction-ui" style="display: none; margin-top: 10px;">
                            <label style="font-size: 0.7rem; opacity: 0.8;">¿La IA se equivocó? Corregí la categoría:</label>
                            <select id="select-carroceria-manual" style="padding: 5px; margin-top: 5px; background: #2a2a32; color: white; border: 1px solid var(--accent-lavender); border-radius: 5px; width: 100%;">
                                <option value="Sedan">Sedán</option>
                                <option value="Hatchback">Hatchback</option>
                                <option value="SUV_Crossover">SUV / Crossover</option>
                                <option value="Pickup">Pickup</option>
                                <option value="Coupe">Coupe</option>
                                <option value="Convertible">Convertible</option>
                                <option value="Wagon">Wagon</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-publish" disabled>Publicar Ahora</button>
            </form>
        </section>
    </main>

    <script src="../js/env.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/utils.js"></script>
    <script type="module" src="../js/publish.js"></script>
    <script src="../js/components.js"></script>

</body>
</html>
